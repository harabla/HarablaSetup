; Sample of iRacing controls.cfg (subset of relevant lines).
; Real file uses key=value with one entry per line, sometimes with
; trailing comments.

[Controls]
; Steering and pedals via the real Fanatec wheel
Steering=Fanatec axis 0
Throttle=Fanatec axis 1
Brake=Fanatec axis 2
Clutch=Fanatec axis 3

; Buttons routed via vJoy Device 1 (Joystick Gremlin output)
Brake Bias increase=vJoy_71
Brake Bias decrease=vJoy_72
Pit Limiter=vJoy_45
Headlights flash=vJoy_46
Push to talk in-car=vJoy_47

; Black box navigation (UPDN-R + B8 joystick via vJoy)
Black Box next=vJoy_50
Black Box previous=vJoy_51
Black Box row up=vJoy_52
Black Box row down=vJoy_53
Black Box tab left=vJoy_54
Black Box tab right=vJoy_55
Black Box click=vJoy_56

; Look controls
Look Left=vJoy_60
Look Right=vJoy_61
Reset View=vJoy_62
